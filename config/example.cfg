# uomapgen example configuration
#
# INI-like "key = value". Lines starting with '#' or ';' are comments.
# Keys mirror the CLI long options; '-' and '_' are interchangeable.
# Precedence: built-in defaults < this file < command-line flags.
# NOTE: uomapgen never reads environment variables. Everything is here or on
# the command line.

# Master seed. Same seed + same build => byte-identical output.
seed = 42

# Facet / file index -> map<N>.mul, staidx<N>.mul, statics<N>.mul
map = 0

# Dimensions in tiles (each must be a multiple of 8).
# Or set 'preset = felucca' (7168x4096) / 'preset = test' (1024x1024).
width  = 1024
height = 1024
# preset = felucca

# Output directory (created if missing).
out = ./out

# Terrain shaping ---------------------------------------------------------
sea_level  = 0.0      # elevation noise threshold for water, [-1, 1]
frequency  = 0.004    # base noise frequency (smaller = larger landmasses)
octaves    = 5        # fBm octaves (more = more detail)
max_slope  = 4        # max z step between adjacent land tiles (navigability)
land_z_max = 45       # highest land z produced from elevation (0..127)
water_z    = -5       # flat z assigned to water cells

# Reference client asset used only to sanity-check tile flags (optional).
tiledata = ./ref/UONewDawn/tiledata.mul

# Enrichment (all ON by default) -----------------------------------------
biomes            = true      # climate biomes (snow poles, desert/jungle equator)
temperature_bias  = 0.0       # shift climate warmer(+)/colder(-)
vegetation        = true      # place tree/rock/plant statics
tree_density      = 0.08      # 0..1 fraction of eligible cells with a tree
rock_density      = 0.02      # 0..1 rocks/boulders on hills/mountains
plant_density     = 0.05      # 0..1 ground cover (plants/flowers/ferns)
beaches           = true      # sloped sand beaches around all coasts
beach_width       = 4         # beach band width in tiles
lakes             = true      # ponds at inland river sinks
passes            = true      # carve walkable passes through mountains

# Optional outputs --------------------------------------------------------
preview      = ./out/preview.png   # comment out to skip the PNG
emit_mapdef  = true                # write map-definitions.snippet.json
terrain_only = false               # true = skip staidx/statics

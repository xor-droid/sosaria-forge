name: Auto-close pull requests

# This repository is read-only to the public: forks are welcome, but changes
# and change-candidates (pull requests) are not accepted. GitHub has no native
# switch to disable PRs, so this workflow politely closes any that are opened.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR" --repo "$REPO" --body \
            "Thanks for your interest! This repository is **read-only** — pull requests are not accepted. You're very welcome to **fork** it and build on it freely. This PR is being closed automatically."
          gh pr close "$PR" --repo "$REPO"
